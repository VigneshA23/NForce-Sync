spring:
  application:
    name: nforce-sync

  datasource:
    url: jdbc:postgresql://localhost:5432/nforce_sync
    username: appanivignesh
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # CHANGE IN PRODUCTION — move to environment variable JWT_SECRET, min 32 chars for HS256
    secret: "nforce-sync-dev-only-secret-key-change-this-in-prod-env-var-32chars+"

logging:
  level:
    org.hibernate.SQL: DEBUG
