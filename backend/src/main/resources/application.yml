spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: nforce-sync

  datasource:
    url: jdbc:postgresql://ep-curly-block-az1o59ol.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gBPETcD1Zb3m
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # CHANGE IN PRODUCTION — move to environment variable JWT_SECRET, min 32 chars for HS256
    secret: "nforce-sync-dev-only-secret-key-change-this-in-prod-env-var-32chars+"
  base-url: http://localhost:5173
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

resend:
  api-key: ${RESEND_API_KEY:}
  from: NForce Sync <onboarding@nforceone.com>

logging:
  level:
    org.hibernate.SQL: WARN
