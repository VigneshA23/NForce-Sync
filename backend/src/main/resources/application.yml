spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: nforce-sync

  datasource:
    url: jdbc:postgresql://ep-curly-block-az1o59ol.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gBPETcD1Zb3m
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # CHANGE IN PRODUCTION — move to environment variable JWT_SECRET, min 32 chars for HS256
    secret: "nforce-sync-dev-only-secret-key-change-this-in-prod-env-var-32chars+"
  base-url: http://localhost:5173

resend:
  api-key: ${RESEND_API_KEY:re_placeholder_set_RESEND_API_KEY_env_var}
  from: NForce Sync <onboarding@nforceone.com>

logging:
  level:
    org.hibernate.SQL: DEBUG
