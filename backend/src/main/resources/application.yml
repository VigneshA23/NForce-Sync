spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: nforce-sync

  datasource:
    url: jdbc:postgresql://ep-curly-block-az1o59ol.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    username: neondb_owner
    password: npg_gBPETcD1Zb3m
    driver-class-name: org.postgresql.Driver
    hikari:
      # Bumped from 2/10: dashboard endpoints now fan independent reads out across a bounded
      # executor (see AsyncQueryConfig) instead of running them one at a time on a single
      # connection, so one request can legitimately hold several connections at once. 20/6 gives
      # headroom for a handful of concurrent dashboard loads without exhausting the pool.
      minimum-idle: 6
      maximum-pool-size: 20
      keepalive-time: 30000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      # Both attachment features share the same per-file cap now (app.eod-attachment.max-file-size-bytes
      # below — EOD attachments and Blocker reply attachments alike). EOD uploads one file per
      # request, but a Blocker reply can carry up to 4 files (see MAX_ATTACHMENTS_PER_REPLY in
      # BlockerConversationService/BlockerThread.tsx) — max-request-size must cover that worst case
      # (4 * 10 MB) with headroom, or Spring's own limit would reject a valid 4-large-file reply
      # before either feature's own validation even runs.
      max-file-size: 10MB
      max-request-size: 45MB

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # CHANGE IN PRODUCTION — move to environment variable JWT_SECRET, min 32 chars for HS256
    secret: "nforce-sync-dev-only-secret-key-change-this-in-prod-env-var-32chars+"
  # Fallback only — used when a request carries no recognisable Origin (e.g. the scheduled EOD
  # reminder job). Live requests get the origin they came from, via AppBaseUrlResolver.
  base-url: http://localhost:5173
  cors:
    # Comma-separated. Doubles as the allow-list for links in emails: a password reset requested
    # from the deployed site links back to that site, one from local dev links to localhost.
    # Override per environment with FRONTEND_URL.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,https://nforce-sync-git-dev-nforce-one.vercel.app}
  # EOD Supporting Attachments — change these to retune limits, no code change needed.
  # Mirrored on the frontend in lib/eodAttachments.ts's own constants; keep both sides in sync.
  # max-file-size-bytes and max-total-storage-bytes are also reused as-is by Blocker reply
  # attachments (BlockerConversationService) so file-size/storage governance stays consistent
  # app-wide — only max-attachments-per-entry/per-task are EOD-specific (Blockers has its own
  # separate per-reply count cap, MAX_ATTACHMENTS_PER_REPLY, not read from here).
  eod-attachment:
    max-file-size-bytes: 10485760      # 10 MB per file — EOD attachments AND Blocker replies
    max-attachments-per-entry: 10      # EOD-level cap
    max-attachments-per-task: 5        # per-task cap
    # App-wide circuit breaker on TOTAL bytes stored, independent of the per-file/per-entry caps
    # above, which only bound one upload at a time and do nothing to stop unbounded growth across
    # every employee over months of use. Enforced separately per feature (EodAttachmentRepository
    # vs BlockerReplyAttachmentRepository each sum their own table), both against this same 2 GB
    # ceiling. 2 GB is a starting guess, not a measured quota: comfortably above what routine usage
    # (occasional screenshots/PDFs/docs, capped at 10 MB each) should accumulate even across a full
    # team over months, while still acting as a real backstop protecting the shared Postgres
    # instance from runaway growth. Re-tune from real usage once this has been live a while — see
    # EodAttachmentService.assertStorageAvailable / BlockerConversationService.saveReply.
    max-total-storage-bytes: 2147483648   # 2 GB

resend:
  api-key: ${RESEND_API_KEY:}
  from: NForce Sync <onboarding@nforceone.com>

logging:
  level:
    org.hibernate.SQL: WARN
